resources:
  repositories:
    - repository: templates
      type: git
      name: Template
      
trigger: none

variables:
- group: secrets
      
stages:
- stage: BuildMinorRelease
  jobs:
  - job: Build
    variables:
      build.clean: all
      platform: x64
      version: "current"
      appVersion: "1.0"
      appBuild: $[counter(variables['appVersion'],90000)]
      appRevision: 0
      createRuntimePackages: False
      skipComponentGovernanceDetection: True

    pool:
      name: Default

    steps:
    - template: build-steps.yml@templates

